# SPDX-License-Identifier: MIT
name: RAFCODE OpenPGP FS scoped gate
on:
  pull_request:
    paths:
      - 'rafcode/openpgp_fs/**'
      - '.github/workflows/rafpgp-fs-gate.yml'
  push:
    paths:
      - 'rafcode/openpgp_fs/**'
      - '.github/workflows/rafpgp-fs-gate.yml'
permissions:
  contents: read
jobs:
  scoped-host-cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Host tests and ARM object cross compile (not device / crypto E2E)
        shell: bash
        run: sh rafcode/openpgp_fs/verify.sh
